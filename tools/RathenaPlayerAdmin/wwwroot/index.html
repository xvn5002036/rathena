<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>rAthena 玩家資料管理</title>
  <style>
    :root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#172033;background:#f3f6fb}body{margin:0}header{background:#172033;color:#fff;padding:18px 24px}main{max-width:1400px;margin:auto;padding:20px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 12px #16213a14}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px;font-size:13px}input,button,select{font:inherit;padding:8px 10px;border:1px solid #cbd3df;border-radius:7px}button{cursor:pointer;background:#2257d8;color:white;border:0}button.secondary{background:#637083}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e5e9f0;text-align:left}tr:hover{background:#f6f8fc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.tabs button{margin-right:6px}.muted{color:#697386}.danger{color:#ad1f2d}.ok{color:#08783e}dialog{width:min(950px,94vw);border:0;border-radius:12px;padding:20px}dialog::backdrop{background:#0008}.scroll{overflow:auto;max-height:540px}.selected{background:#eaf0ff!important}
    .item-icon{width:44px;height:44px;object-fit:contain;vertical-align:middle}.item-link{color:#2257d8;text-decoration:none}.item-link:hover{text-decoration:underline}.grid input,.grid select{min-width:0;width:100%;box-sizing:border-box}button.danger-button{background:#ad1f2d}.command-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.command-button{text-align:left}.command-usage{display:block;font-size:11px;opacity:.75;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
  </style>
</head>
<body>
<header><h2 style="margin:0">rAthena 玩家資料管理</h2><div style="opacity:.75">角色素質、身上裝備、背包與倉庫</div></header>
<main>
  <section class="card">
    <div class="row">
      <label>角色名稱／Char ID／Account ID<input id="query" placeholder="輸入關鍵字"></label>
      <button onclick="searchCharacters()">搜尋</button>
    </div>
  </section>

  <section class="card scroll">
    <table><thead><tr><th>Char ID</th><th>Account</th><th>名稱</th><th>職業</th><th>Base</th><th>Job</th><th>Zeny</th><th>地圖</th><th>狀態</th></tr></thead><tbody id="characters"></tbody></table>
  </section>

  <section id="detail" class="card" hidden>
    <h3 id="charTitle"></h3>
    <p id="warning" class="danger"></p>
    <div class="tabs"><button onclick="showTab('stats')">人物素質</button><button onclick="loadInventory()">裝備／背包</button><button onclick="loadStorage()">帳號倉庫</button><button onclick="showAtCommands()">GM 指令</button><button class="danger-button" onclick="openCloneDialog()">完整複製到 GM</button></div>
    <div id="statsTab"></div>
    <div id="itemsTab" class="scroll"></div>
  </section>
</main>

<dialog id="itemDialog"><form method="dialog"><button class="secondary" style="float:right">關閉</button></form><h3>修改物品</h3><div id="itemForm" class="grid"></div><p><button onclick="saveItem()">儲存物品</button></p><div id="itemMessage"></div></dialog>
<dialog id="cloneDialog"><form method="dialog"><button class="secondary" style="float:right">關閉</button></form><h3>完整複製玩家資料到 GM</h3><p>來源玩家：<b id="cloneSource"></b></p><p class="danger">此操作會覆蓋目標 GM 的人物素質、技能、背包、穿著裝備與帳號倉庫。來源及目標必須離線。</p><label>目標 GM 的 Char ID<input id="cloneTargetId" type="number" min="1" placeholder="例如：150000"></label><p><button class="danger-button" onclick="cloneToGm()">確認完整複製</button></p><div id="cloneMessage"></div></dialog>
<dialog id="commandDialog"><form method="dialog"><button class="secondary" style="float:right">關閉</button></form><h3>發送 GM 指令</h3><p>執行角色：<b id="commandExecutor"></b></p><p><b id="commandName"></b></p><p id="commandDescription"></p><p class="danger" id="commandDanger" hidden>注意：這是高風險管理指令，執行前請確認參數與影響範圍。</p><label id="commandArgsLabel">指令參數<input id="commandArgs" autocomplete="off"></label><p class="muted" id="commandUsage"></p><p><button onclick="sendAtCommand()">發送到遊戲</button></p><div id="commandMessage"></div></dialog>
<script>
let current=null,currentContainer='',editingItem=null,commandCatalog=[],selectedCommand=null;
const statFields=['Str','Agi','Vit','IntStat','Dex','Luk','Pow','Sta','Wis','Spl','Con','Crt','BaseLevel','JobLevel','Zeny','CashPoints','KafraPoints','StatusPoint','SkillPoint','TraitPoint'];
const statLabels={Str:'力量（STR）',Agi:'敏捷（AGI）',Vit:'體質（VIT）',IntStat:'智力（INT）',Dex:'靈巧（DEX）',Luk:'幸運（LUK）',Pow:'威力（POW）',Sta:'耐力（STA）',Wis:'智慧（WIS）',Spl:'法術（SPL）',Con:'專注（CON）',Crt:'創造（CRT）',BaseLevel:'基本等級（Base Level）',JobLevel:'職業等級（Job Level）',Zeny:'金幣（Zeny）',CashPoints:'商城點數（Cash Points）',KafraPoints:'卡普拉點數（Kafra Points）',StatusPoint:'素質點數',SkillPoint:'技能點數',TraitPoint:'特性點數'};
const itemFields=['NameId','Amount','Equip','Identify','Refine','Attribute','Card0','Card1','Card2','Card3','OptionId0','OptionVal0','OptionParm0','OptionId1','OptionVal1','OptionParm1','OptionId2','OptionVal2','OptionParm2','OptionId3','OptionVal3','OptionParm3','OptionId4','OptionVal4','OptionParm4','ExpireTime','Bound','EnchantGrade'];
const itemLabels={NameId:'道具編號（NameID）',Amount:'數量（Amount）',Equip:'裝備位置代碼（Equip）',Identify:'鑑定狀態（Identify）',Refine:'精煉值（Refine）',Attribute:'損壞狀態（Attribute，0＝正常、1＝損壞）',Card0:'卡片槽 1（Card0）',Card1:'卡片槽 2（Card1）',Card2:'卡片槽 3（Card2）',Card3:'卡片槽 4（Card3）',OptionId0:'隨機屬性 1 編號',OptionVal0:'隨機屬性 1 數值',OptionParm0:'隨機屬性 1 參數',OptionId1:'隨機屬性 2 編號',OptionVal1:'隨機屬性 2 數值',OptionParm1:'隨機屬性 2 參數',OptionId2:'隨機屬性 3 編號',OptionVal2:'隨機屬性 3 數值',OptionParm2:'隨機屬性 3 參數',OptionId3:'隨機屬性 4 編號',OptionVal3:'隨機屬性 4 數值',OptionParm3:'隨機屬性 4 參數',OptionId4:'隨機屬性 5 編號',OptionVal4:'隨機屬性 5 數值',OptionParm4:'隨機屬性 5 參數',ExpireTime:'到期時間（Unix 時間戳）',Bound:'綁定類型（Bound）',EnchantGrade:'裝備階級（Enchant Grade）'};
function headers(){return {'Content-Type':'application/json'}}
function normalizeKeys(value){if(Array.isArray(value))return value.map(normalizeKeys);if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).map(([key,item])=>[key.charAt(0).toLowerCase()+key.slice(1),normalizeKeys(item)]));return value}
async function api(url,opts={}){const r=await fetch(url,opts);const data=normalizeKeys(await r.json().catch(()=>({})));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
async function searchCharacters(){
 const q=encodeURIComponent(document.getElementById('query').value); const rows=await api('/api/characters?q='+q); const body=document.getElementById('characters');body.innerHTML='';
 rows.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${x.charId}</td><td>${x.accountId}</td><td>${esc(x.name)}</td><td>${x.class}</td><td>${x.baseLevel}</td><td>${x.jobLevel}</td><td>${x.zeny}</td><td>${esc(x.lastMap||'')}</td><td class="${x.online?'danger':'ok'}">${x.online?'在線':'離線'}</td>`;tr.onclick=()=>selectCharacter(x.charId);body.appendChild(tr)})
}
async function selectCharacter(id){current=await api('/api/characters/'+id);document.getElementById('detail').hidden=false;document.getElementById('charTitle').textContent=`${current.name}（Char ${current.charId} / Account ${current.accountId}）`;document.getElementById('warning').textContent=current.online?'角色目前在線；儲存時會自動踢下線，修改完成後請玩家重新登入。':'';showTab('stats')}
function showTab(tab){document.getElementById('itemsTab').innerHTML='';if(tab==='stats')renderStats()}
function renderStats(){const box=document.getElementById('statsTab');box.innerHTML='<h4>人物素質與點數</h4><div class="grid" id="statsGrid"></div><p><button onclick="saveStats()">儲存素質</button></p><div id="statsMessage"></div>';const grid=document.getElementById('statsGrid');statFields.forEach(f=>grid.insertAdjacentHTML('beforeend',`<label>${statLabels[f]}<input id="s_${f}" type="number" value="${current[f.charAt(0).toLowerCase()+f.slice(1)]??0}"></label>`))}
async function saveStats(){try{const body={};statFields.forEach(f=>body[f.charAt(0).toLowerCase()+f.slice(1)]=Number(document.getElementById('s_'+f).value));await api('/api/characters/'+current.charId+'/stats',{method:'PUT',headers:headers(),body:JSON.stringify(body)});document.getElementById('statsMessage').innerHTML='<span class="ok">已儲存。</span>';await selectCharacter(current.charId)}catch(e){document.getElementById('statsMessage').innerHTML='<span class="danger">'+esc(e.message)+'</span>'}}
async function loadInventory(){currentContainer='inventory';document.getElementById('itemsTab').classList.add('scroll');renderItems(await api('/api/characters/'+current.charId+'/inventory'))}
async function loadStorage(){currentContainer='storage';document.getElementById('itemsTab').classList.add('scroll');renderItems(await api('/api/accounts/'+current.accountId+'/storage'))}
function renderItems(items){document.getElementById('statsTab').innerHTML='';const box=document.getElementById('itemsTab');box.innerHTML=`<div class="row"><h4 style="margin-right:auto">${currentContainer==='inventory'?'裝備／背包':'帳號倉庫'}（${items.length}）</h4><button onclick="openNewItem()">新增物品</button></div><p class="muted">點擊圖片或 NameID 可至幻想廳查看中文名稱與完整說明。</p><table><thead><tr><th>圖片</th><th>ID</th><th>NameID</th><th>數量</th><th>裝備位置</th><th>精煉</th><th>階級</th><th>卡片</th><th></th></tr></thead><tbody>${items.map(x=>{const infoUrl=`https://rd.fharr.com/db/item/${x.nameId}`;const imageUrl=`https://rd.fharr.com/images/tw/item/thumbnail/${x.nameId}/`;return `<tr><td><a href="${infoUrl}" target="_blank" rel="noopener noreferrer" title="查看中文名稱與說明"><img class="item-icon" src="${imageUrl}" alt="NameID ${x.nameId}" loading="lazy"></a></td><td>${x.id}</td><td><a class="item-link" href="${infoUrl}" target="_blank" rel="noopener noreferrer">${x.nameId}</a></td><td>${x.amount}</td><td>${x.equip}</td><td>+${x.refine}</td><td>${x.enchantGrade}</td><td>${x.card0}, ${x.card1}, ${x.card2}, ${x.card3}</td><td><button onclick='editItem(${JSON.stringify(x)})'>編輯</button> <button class="danger-button" onclick="deleteItem(${x.id},${x.nameId})">刪除</button></td></tr>`}).join('')}</tbody></table>`}
function simpleItemControl(field,label,item){const value=item[field.charAt(0).toLowerCase()+field.slice(1)]??0;const choices=field==='Identify'?[[1,'已鑑定'],[0,'未鑑定']]:field==='Bound'?[[0,'無綁定'],[1,'帳號綁定'],[2,'角色綁定'],[3,'公會綁定'],[4,'隊伍綁定']]:field==='EnchantGrade'?[[0,'無階級'],[1,'D 階'],[2,'C 階'],[3,'B 階'],[4,'A 階']]:null;if(!choices)return `<label>${label}<input id="i_${field}" type="number" value="${value}"></label>`;return `<label>${label.replace(/（.*）/,'')}<select id="i_${field}">${choices.map(([id,text])=>`<option value="${id}" ${Number(value)===id?'selected':''}>${text}</option>`).join('')}</select></label>`}
function editItem(item){editingItem=item;const form=document.getElementById('itemForm');const infoUrl=`https://rd.fharr.com/db/item/${item.nameId}`;const imageUrl=`https://rd.fharr.com/images/tw/item/thumbnail/${item.nameId}/`;form.innerHTML=`<div style="grid-column:1/-1;display:flex;align-items:center;gap:12px"><a href="${infoUrl}" target="_blank" rel="noopener noreferrer"><img class="item-icon" src="${imageUrl}" alt="道具圖片"></a><div><b>GM 完整編輯模式</b><div class="muted">所有資料庫欄位均可修改；括號內保留英文原始名稱方便查表。</div><a class="item-link" href="${infoUrl}" target="_blank" rel="noopener noreferrer">查看中文名稱與道具說明</a></div></div>`;itemFields.forEach(field=>form.insertAdjacentHTML('beforeend',simpleItemControl(field,itemLabels[field],item)));document.getElementById('itemMessage').innerHTML='';document.getElementById('itemDialog').showModal()}
function openNewItem(){const item=Object.fromEntries(itemFields.map(field=>[field.charAt(0).toLowerCase()+field.slice(1),0]));item.id=null;item.nameId=501;item.amount=1;item.identify=1;editItem(item)}
async function saveItem(){try{const body={};itemFields.forEach(field=>{const key=field.charAt(0).toLowerCase()+field.slice(1);body[key]=Number(document.getElementById('i_'+field).value)});const creating=editingItem.id==null;const url=creating?(currentContainer==='inventory'?`/api/characters/${current.charId}/inventory`:`/api/accounts/${current.accountId}/storage`):`/api/items/${currentContainer}/${editingItem.id}`;await api(url,{method:creating?'POST':'PUT',headers:headers(),body:JSON.stringify(body)});document.getElementById('itemMessage').innerHTML='<span class="ok">已儲存物品。</span>';currentContainer==='inventory'?await loadInventory():await loadStorage()}catch(e){document.getElementById('itemMessage').innerHTML='<span class="danger">'+esc(e.message)+'</span>'}}
async function deleteItem(id,nameId){if(!confirm(`確定要永久刪除 NameID ${nameId}？此操作無法復原。`))return;try{await api(`/api/items/${currentContainer}/${id}`,{method:'DELETE',headers:headers()});currentContainer==='inventory'?await loadInventory():await loadStorage()}catch(e){alert(e.message)}}
function openCloneDialog(){document.getElementById('cloneSource').textContent=`${current.name}（Char ${current.charId}）`;document.getElementById('cloneTargetId').value='';document.getElementById('cloneMessage').innerHTML='';document.getElementById('cloneDialog').showModal()}
async function cloneToGm(){const targetCharId=Number(document.getElementById('cloneTargetId').value);if(!targetCharId){document.getElementById('cloneMessage').innerHTML='<span class="danger">請輸入目標 GM 的 Char ID。</span>';return}if(!confirm('這會清空並覆蓋目標 GM 的素質、技能、背包、裝備與倉庫。確定繼續？'))return;try{await api(`/api/characters/${current.charId}/clone-to-gm`,{method:'POST',headers:headers(),body:JSON.stringify({targetCharId})});document.getElementById('cloneMessage').innerHTML='<span class="ok">完整複製成功。請登入目標 GM 測試。</span>'}catch(e){document.getElementById('cloneMessage').innerHTML='<span class="danger">'+esc(e.message)+'</span>'}}
const commandCategories={'System Commands':'系統指令','Database Commands':'資料庫查詢','Player Information Commands':'玩家資料查詢','Action Commands':'角色操作','Administrative Commands':'管理指令','Party Commands':'隊伍指令','Guild Commands':'公會指令','Pet Commands':'寵物指令','Homunculus Commands':'生命體指令','Channel Commands':'頻道指令','Clan Commands':'氏族指令'};
const commandHelp={
'@version':'顯示目前伺服器版本。','@rates':'顯示經驗值與掉寶倍率。','@time':'顯示伺服器時間與晝夜狀態。','@uptime':'顯示 map-server 已運行多久。','@refresh':'重新同步自己的畫面與位置。','@refreshall':'重新同步所有在線玩家。','@commands':'顯示此 GM 可使用的指令。','@help':'查詢指定 GM 指令的說明。','@users':'顯示目前在線人數。','@who':'搜尋在線玩家。','@whogm':'搜尋在線 GM。','@where':'查詢玩家所在位置。','@accinfo':'查詢玩家帳號資料。','@stats':'顯示角色完整素質。','@itemlist':'顯示角色背包物品。','@storagelist':'顯示指定玩家的倉庫物品。','@mobinfo':'查詢魔物資料。','@iteminfo':'查詢道具資料。','@whodrops':'查詢哪些魔物會掉落指定道具。','@whereis':'查詢指定魔物出現的地圖。','@idsearch':'用名稱搜尋道具 ID。','@mobsearch':'搜尋地圖上的指定魔物。','@item':'取得指定道具與數量。','@item2':'取得可指定精煉、卡片等資料的道具。','@itembound':'取得綁定道具。','@delitem':'從自己身上刪除指定道具。','@identifyall':'鑑定背包內全部未鑑定物品。','@refine':'調整指定裝備位置的精煉值。','@grade':'調整指定裝備位置的階級。','@repairall':'修復身上全部損壞裝備。','@storeall':'將背包物品存入倉庫。','@clearstorage':'清空個人倉庫。','@itemreset':'清空角色背包。','@warp':'傳送到指定地圖與座標。','@go':'傳送到常用城市。','@jump':'在目前地圖移動到指定座標。','@jumpto':'傳送到指定玩家身邊。','@recall':'將指定玩家召喚到自己身邊。','@recallall':'召喚全部在線玩家。','@save':'將目前位置設為角色儲存點。','@load':'回到角色儲存點。','@monster':'在目前地圖召喚魔物。','@killmonster':'清除目前地圖的一般魔物。','@killmonster2':'清除目前地圖魔物且不掉落物品。','@broadcast':'向全伺服器發送公告訊息。','@localbroadcast':'向目前 map-server 發送公告。','@kami':'向全伺服器發送匿名公告。','@announce':'使用指定顏色與範圍發送公告。','@kick':'將指定玩家踢下線。','@kickall':'將全部玩家踢下線。','@ban':'封鎖指定帳號一段時間。','@unban':'解除指定帳號封鎖。','@jail':'將指定玩家關入監獄。','@unjail':'解除指定玩家的監禁。','@mute':'禁止指定玩家發言。','@doom':'殺死全部在線玩家。','@kill':'殺死指定玩家。','@alive':'復活自己。','@raise':'復活指定玩家。','@raiseall':'復活全部玩家。','@blvl':'增加或降低基本等級。','@jlvl':'增加或降低職業等級。','@jobchange':'變更角色職業。','@allskill':'學會目前職業的全部技能。','@reset':'重置角色素質與技能。','@stpoint':'增加或減少素質點數。','@skpoint':'增加或減少技能點數。','@zeny':'增加或減少 Zeny。','@cash':'增加或減少商城點數。','@points':'增加或減少卡普拉點數。','@agitstart':'開始城戰。','@agitend':'結束城戰。','@pvpon':'開啟目前地圖 PvP。','@pvpoff':'關閉目前地圖 PvP。','@gvgon':'開啟目前地圖 GvG。','@gvgoff':'關閉目前地圖 GvG。','@day':'切換為白天。','@night':'切換為夜晚。','@weather':'變更地圖天氣效果。','@reloadscript':'重新載入全部 NPC 腳本。','@reloaditemdb':'重新載入道具資料庫。','@reloadmobdb':'重新載入魔物資料庫。','@reloadbattleconf':'重新載入戰鬥設定。','@shutdown':'關閉伺服器。'
};
const dangerousCommands=new Set(['@kickall','@doom','@doommap','@itemreset','@clearstorage','@cleargstorage','@clearcart','@reloadscript','@shutdown','@ban','@unban','@jail','@recallall','@raiseall','@agitstart','@agitend']);
async function showAtCommands(){document.getElementById('statsTab').innerHTML='';const box=document.getElementById('itemsTab');box.classList.remove('scroll');box.innerHTML='<h4>GM 指令面板</h4><p class="muted">目前選擇的角色會作為指令執行者，必須是在線 GM。執行結果會顯示在遊戲聊天視窗。</p><input id="commandSearch" placeholder="搜尋指令，例如：item、warp、broadcast" style="width:min(420px,100%);box-sizing:border-box"><div id="commandList"></div>';if(!commandCatalog.length)commandCatalog=await api('/api/atcommands');document.getElementById('commandSearch').addEventListener('input',renderCommandList);renderCommandList()}
function getCommandDescription(command){return commandHelp[command.name]||command.descriptionZh||'此指令的文件沒有提供簡短中文說明，請先用 @help 查詢。'}
function translateUsage(usage){const words={'player name':'玩家名稱','character name':'角色名稱','account id':'帳號 ID','char id':'角色 ID','item name/ID':'道具名稱／ID','item name':'道具名稱','item ID':'道具 ID','monster name/ID':'魔物名稱／ID','monster name':'魔物名稱','mob name/ID':'魔物名稱／ID','map name':'地圖名稱','map':'地圖','message':'訊息內容','amount':'數量','quantity':'數量','duration':'持續時間','skill ID':'技能 ID','skill level':'技能等級','effect ID':'特效 ID','player':'玩家','target':'目標','guild name':'公會名稱','party name':'隊伍名稱','channel name':'頻道名稱','command':'指令','value':'數值','type':'類型','name':'名稱','level':'等級','color':'顏色','time':'時間','flag':'旗標','filename':'檔案名稱','npc name':'NPC 名稱','position':'位置','x':'X 座標','y':'Y 座標'};let result=usage;Object.entries(words).sort((a,b)=>b[0].length-a[0].length).forEach(([english,chinese])=>result=result.replaceAll(english,chinese));return result}
function renderCommandList(){const keyword=(document.getElementById('commandSearch').value||'').toLowerCase();const groups={};commandCatalog.filter(command=>(command.name+' '+translateUsage(command.usage)+' '+getCommandDescription(command)).toLowerCase().includes(keyword)).forEach(command=>(groups[command.category]??=[]).push(command));document.getElementById('commandList').innerHTML=Object.entries(groups).map(([category,commands])=>`<h4>${commandCategories[category]||category}</h4><div class="command-grid">${commands.map(command=>`<button class="command-button" onclick="openAtCommand('${command.name}')">${command.name}<span class="command-usage">${esc(getCommandDescription(command))}</span><span class="command-usage">${esc(translateUsage(command.usage)||'不需參數')}</span></button>`).join('')}</div>`).join('')||'<p class="muted">找不到符合的指令。</p>'}
function openAtCommand(name){selectedCommand=commandCatalog.find(command=>command.name===name);document.getElementById('commandExecutor').textContent=`${current.name}（Char ${current.charId}）`;document.getElementById('commandName').textContent=selectedCommand.name;document.getElementById('commandDescription').textContent=getCommandDescription(selectedCommand);document.getElementById('commandDanger').hidden=!dangerousCommands.has(selectedCommand.name);const chineseUsage=translateUsage(selectedCommand.usage);document.getElementById('commandUsage').textContent=selectedCommand.usage?`完整格式：${selectedCommand.name} ${chineseUsage}`:'此指令不需要參數。';document.getElementById('commandArgsLabel').hidden=!selectedCommand.usage;document.getElementById('commandArgs').value='';document.getElementById('commandArgs').placeholder=chineseUsage;document.getElementById('commandMessage').innerHTML='';document.getElementById('commandDialog').showModal();if(selectedCommand.usage)document.getElementById('commandArgs').focus()}
async function sendAtCommand(){const args=document.getElementById('commandArgs').value.trim();const command=selectedCommand.name+(args?' '+args:'');const message=document.getElementById('commandMessage');try{await api('/api/atcommands/execute',{method:'POST',headers:headers(),body:JSON.stringify({executorCharId:current.charId,command})});message.innerHTML='<span class="muted">已排入佇列，等待 map-server 執行…</span>';for(let attempt=0;attempt<12;attempt++){await new Promise(resolve=>setTimeout(resolve,250));const status=await api(`/api/atcommands/status/${current.charId}`);if(status&&status.command===command&&status.processedAt){message.innerHTML='<span class="ok">map-server 已執行，請查看遊戲聊天視窗。</span>';return}}message.innerHTML='<span class="danger">map-server 尚未執行。請在遊戲輸入 @reloadscript 載入橋接 NPC。</span>'}catch(e){message.innerHTML='<span class="danger">'+esc(e.message)+'</span>'}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('query').addEventListener('keydown',e=>{if(e.key==='Enter')searchCharacters()});searchCharacters();
</script>
</body></html>
