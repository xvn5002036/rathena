<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>rAthena 玩家資料管理</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020; --panel: #121a2d; --panel-2: #182238; --line: #263550;
      --text: #edf3ff; --muted: #91a0b8; --primary: #69a7ff; --primary-2: #367ce5;
      --green: #45d39c; --red: #ff7185; --amber: #ffc664; --shadow: 0 18px 45px #0005;
      font-family: Inter, "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    }
    * { box-sizing: border-box }
    [hidden] { display: none !important }
    body { margin: 0; min-height: 100vh; color: var(--text); background: radial-gradient(circle at 12% 0%, #172d55 0, transparent 34%), var(--bg) }
    button, input, select { font: inherit }
    button { cursor: pointer }
    .app-header { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px clamp(18px,4vw,56px); border-bottom: 1px solid #ffffff10; background: #0b1020cc; backdrop-filter: blur(18px); position: sticky; top: 0; z-index: 10 }
    .brand { display: flex; align-items: center; gap: 12px }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; color: white; font-weight: 800; background: linear-gradient(145deg,#75b4ff,#5b5ee8); box-shadow: 0 8px 24px #4b83eb66 }
    .brand h1 { font-size: 18px; margin: 0 }.brand p { color: var(--muted); font-size: 12px; margin: 3px 0 0 }
    .server-pill { display: flex; align-items: center; gap: 8px; padding: 8px 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; font-size: 12px }
    .server-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green) }
    main { width: min(1480px, calc(100% - 32px)); margin: 24px auto 60px }
    .panel { background: linear-gradient(145deg,#151e32,#10182a); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow) }
    .search-panel { padding: 18px; display: flex; gap: 12px; align-items: center }
    .search-box { flex: 1; position: relative }.search-box span { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted) }
    input, select { width: 100%; color: var(--text); background: #0b1222; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; transition: .2s }
    .search-box input { padding: 13px 14px 13px 42px }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px #4e91f529 }
    .btn { border: 0; border-radius: 10px; padding: 10px 16px; color: white; background: var(--primary-2); font-weight: 700; transition: .18s }
    .btn:hover { filter: brightness(1.12); transform: translateY(-1px) }.btn:disabled { opacity: .55; cursor: wait }
    .btn.secondary { color: var(--text); background: #26344d }.btn.danger { background: #a9374c }.btn.small { padding: 7px 11px; font-size: 12px }
    .layout { display: grid; grid-template-columns: minmax(320px,410px) 1fr; gap: 18px; margin-top: 18px; align-items: start }
    .list-panel { overflow: hidden; position: sticky; top: 100px }.panel-head { padding: 17px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between }.panel-head h2 { font-size: 14px; margin: 0 }.count { color: var(--muted); font-size: 12px }
    .character-list { max-height: calc(100vh - 220px); overflow: auto }.empty { padding: 48px 20px; text-align: center; color: var(--muted) }
    .character-row { width: 100%; text-align: left; border: 0; color: inherit; background: transparent; padding: 14px 16px; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; border-bottom: 1px solid #ffffff0b }
    .character-row:hover, .character-row.active { background: #6ca8ff12 }.character-row.active { box-shadow: inset 3px 0 var(--primary) }
    .avatar { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; color: #cfe2ff; background: linear-gradient(145deg,#263d64,#202a43) }
    .char-name { font-weight: 750; margin-bottom: 4px }.char-meta { color: var(--muted); font-size: 11px }.levels { text-align: right; font-size: 12px }.levels strong { display: block; color: var(--primary) }
    .status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px }.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }.online { color: var(--green) }.offline { color: var(--muted) }
    .detail-panel { min-height: 580px; overflow: hidden }.welcome { min-height: 580px; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 40px }.welcome-icon { font-size: 48px; opacity: .5 }
    .hero { padding: 22px; display: flex; align-items: center; justify-content: space-between; gap: 18px; background: linear-gradient(110deg,#1c3153,#141d30 65%); border-bottom: 1px solid var(--line) }
    .hero h2 { margin: 0 0 8px; font-size: 24px }.hero-meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 12px }.chip { border: 1px solid #ffffff16; border-radius: 999px; padding: 5px 9px; background: #ffffff08 }
    .zeny { text-align: right }.zeny span { display: block; color: var(--muted); font-size: 11px }.zeny strong { font-size: 20px; color: var(--amber) }
    .online-warning { margin: 16px 20px 0; padding: 11px 13px; color: #ffd5a1; background: #6f481f55; border: 1px solid #b4783577; border-radius: 10px; font-size: 12px }
    .tabs { display: flex; overflow-x: auto; gap: 4px; padding: 12px 16px 0; border-bottom: 1px solid var(--line) }.tab { border: 0; color: var(--muted); background: transparent; padding: 11px 13px; white-space: nowrap; border-bottom: 2px solid transparent }.tab:hover { color: var(--text) }.tab.active { color: var(--primary); border-color: var(--primary) }
    .content { padding: 20px }.section-title { margin: 0 0 6px; font-size: 15px }.section-note { margin: 0 0 16px; color: var(--muted); font-size: 12px }
    .stat-section { padding: 16px; background: #0b122277; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px }.stat-section-head { display: flex; justify-content: space-between; margin-bottom: 13px }.stat-section-head h3 { margin: 0; font-size: 13px }.stat-section-head span { color: var(--muted); font-size: 11px }
    .form-grid { display: grid; grid-template-columns: repeat(3,minmax(130px,1fr)); gap: 12px }.field { display: grid; gap: 6px }.field label { color: var(--muted); font-size: 11px }.field small { color: #687993 }
    .actions { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 16px }.message { font-size: 12px }.ok { color: var(--green) }.error { color: var(--red) }.muted { color: var(--muted) }
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px }.toolbar h3 { margin: 0 auto 0 0; font-size: 15px }.toolbar input { width: min(280px,40vw) }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px } table { width: 100%; border-collapse: collapse; min-width: 760px; font-size: 12px } th { position: sticky; top: 0; z-index: 1; color: var(--muted); background: #172238; text-align: left; font-weight: 600 } th, td { padding: 10px 12px; border-bottom: 1px solid var(--line) } tbody tr:hover { background: #ffffff07 }.item-cell { display: flex; align-items: center; gap: 10px }.item-icon { width: 38px; height: 38px; object-fit: contain; background: #0a1020; border-radius: 8px }.item-name { color: var(--primary); text-decoration: none }.row-actions { display: flex; gap: 6px }
    .commands { display: grid; grid-template-columns: repeat(auto-fill,minmax(190px,1fr)); gap: 9px }.command { text-align: left; border: 1px solid var(--line); color: var(--text); background: #111b2e; padding: 11px; border-radius: 10px }.command:hover { border-color: var(--primary); background: #172640 }.command b { color: var(--primary) }.command span { display: block; color: var(--muted); font-size: 10px; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }.category { margin: 22px 0 10px; font-size: 13px }
    .job-picker { display: grid; grid-template-columns: minmax(220px,300px) 1fr; gap: 14px }.job-filters { display: grid; gap: 10px; align-content: start }.job-list { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 12px }.job-card { width: 100%; display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; padding: 12px; text-align: left; color: var(--text); background: transparent; border: 0; border-bottom: 1px solid var(--line) }.job-card:hover,.job-card.selected { background: #6ca8ff12 }.job-card.selected { box-shadow: inset 3px 0 var(--primary) }.job-id { color: var(--primary); font-weight: 800 }.job-card b { display: block; font-size: 13px }.job-card small { display: block; margin-top: 4px; color: var(--muted) }.job-current { color: var(--green); font-size: 10px }.job-detail { min-height: 260px; padding: 20px; background: #0b122277; border: 1px solid var(--line); border-radius: 14px }.job-detail h3 { margin: 5px 0 8px }.job-constant { color: var(--primary); font-family: ui-monospace,monospace; font-size: 12px }.job-description { color: var(--muted); line-height: 1.7; font-size: 13px }.job-caution { margin-top: 18px; padding: 12px; color: #ffd5a1; border: 1px solid #b4783577; background: #6f481f35; border-radius: 10px; font-size: 12px; line-height: 1.6 }
    dialog { width: min(920px,calc(100% - 24px)); max-height: 90vh; overflow: auto; color: var(--text); background: #121a2d; border: 1px solid var(--line); border-radius: 18px; padding: 0; box-shadow: var(--shadow) } dialog::backdrop { background: #030712bb; backdrop-filter: blur(5px) }.dialog-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #172238; border-bottom: 1px solid var(--line) }.dialog-head h3 { margin: 0; font-size: 16px }.dialog-body { padding: 20px }.close { border: 0; color: var(--muted); background: transparent; font-size: 22px }.danger-zone { margin-top: 26px; padding: 16px; border: 1px solid #a83d5266; background: #5c1e2a35; border-radius: 12px }.danger-zone h3 { color: var(--red); margin: 0 0 7px; font-size: 14px }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 30; max-width: 360px; padding: 12px 15px; border-radius: 11px; background: #17243b; border: 1px solid var(--line); box-shadow: var(--shadow); transform: translateY(90px); opacity: 0; transition: .25s }.toast.show { transform: none; opacity: 1 }.toast.bad { border-color: #a83d52; color: #ffd5db }
    @media(max-width:900px){.layout{grid-template-columns:1fr}.list-panel{position:static}.character-list{max-height:360px}.form-grid{grid-template-columns:repeat(2,1fr)}.job-picker{grid-template-columns:1fr}}
    @media(max-width:560px){main{width:min(100% - 18px,1480px);margin-top:10px}.app-header{padding:12px}.server-pill{display:none}.search-panel{flex-direction:column}.search-panel .btn{width:100%}.form-grid{grid-template-columns:1fr}.hero{align-items:flex-start}.zeny{display:none}.content{padding:14px}.toolbar{flex-wrap:wrap}.toolbar input{width:100%}}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><div class="brand-mark">RA</div><div><h1>rAthena 玩家資料管理</h1><p>角色、物品與伺服器管理中心</p></div></div>
    <div class="server-pill"><i></i>管理工具已啟動</div>
  </header>
  <main>
    <section class="panel search-panel">
      <div class="search-box"><span>⌕</span><input id="query" placeholder="搜尋角色名稱、Char ID 或 Account ID" autocomplete="off"></div>
      <button id="searchButton" class="btn" onclick="searchCharacters()">搜尋角色</button>
    </section>
    <div class="layout">
      <aside class="panel list-panel">
        <div class="panel-head"><h2>角色清單</h2><span id="resultCount" class="count">0 位角色</span></div>
        <div id="characters" class="character-list"><div class="empty">正在載入角色…</div></div>
      </aside>
      <section class="panel detail-panel">
        <div id="welcome" class="welcome"><div><div class="welcome-icon">♙</div><h2>選擇一位角色</h2><p>從左側清單選取角色以檢視及修改資料</p></div></div>
        <div id="detail" hidden>
          <div class="hero"><div><h2 id="charTitle"></h2><div id="charMeta" class="hero-meta"></div></div><div class="zeny"><span>持有 Zeny</span><strong id="charZeny">0</strong></div></div>
          <div id="warning" class="online-warning" hidden></div>
          <nav class="tabs" id="tabs">
            <button class="tab active" data-tab="stats" onclick="showTab('stats')">能力與資源</button>
            <button class="tab" data-tab="jobs" onclick="showTab('jobs')">職業管理</button>
            <button class="tab" data-tab="inventory" onclick="showTab('inventory')">背包與裝備</button>
            <button class="tab" data-tab="storage" onclick="showTab('storage')">帳號倉庫</button>
            <button class="tab" data-tab="commands" onclick="showTab('commands')">GM 指令</button>
            <button class="tab" data-tab="advanced" onclick="showTab('advanced')">進階操作</button>
          </nav>
          <div id="content" class="content"></div>
        </div>
      </section>
    </div>
  </main>
  <dialog id="itemDialog"><div class="dialog-head"><h3 id="itemDialogTitle">編輯物品</h3><button class="close" onclick="closeDialog('itemDialog')">×</button></div><div class="dialog-body"><div id="itemForm"></div><div class="actions"><span id="itemMessage" class="message"></span><button class="btn" onclick="saveItem()">儲存物品</button></div></div></dialog>
  <dialog id="commandDialog"><div class="dialog-head"><h3 id="commandName">執行 GM 指令</h3><button class="close" onclick="closeDialog('commandDialog')">×</button></div><div class="dialog-body"><p id="commandDescription" class="muted"></p><div id="commandDanger" class="online-warning" hidden>此指令可能造成大量或不可逆的變更，執行前請再次確認。</div><div class="field" style="margin-top:16px"><label>指令參數</label><input id="commandArgs" autocomplete="off"><small id="commandUsage"></small></div><div class="actions"><span id="commandMessage" class="message"></span><button class="btn" onclick="sendAtCommand()">送出指令</button></div></div></dialog>
  <div id="toast" class="toast"></div>
  <script>
    let current=null,currentContainer='',editingItem=null,commandCatalog=[],selectedCommand=null,itemCache=[],jobCatalog=[],selectedJob=null;
    const statGroups=[
      {title:'基本能力',note:'六大基礎素質',fields:[['str','STR 力量'],['agi','AGI 敏捷'],['vit','VIT 體質'],['intStat','INT 智力'],['dex','DEX 靈巧'],['luk','LUK 幸運']]},
      {title:'四轉特性',note:'擴充職業特性能力',fields:[['pow','POW 威力'],['sta','STA 耐力'],['wis','WIS 智慧'],['spl','SPL 法術'],['con','CON 專注'],['crt','CRT 創造']]},
      {title:'等級與資源',note:'角色進度及持有點數',fields:[['baseLevel','Base 等級'],['jobLevel','Job 等級'],['zeny','Zeny'],['statusPoint','素質點'],['skillPoint','技能點'],['traitPoint','特性點'],['cashPoints','商城點數'],['kafraPoints','Kafra 點數']]}
    ];
    const itemGroups=[
      {title:'基本資料',fields:[['nameId','物品 NameID'],['amount','數量'],['identify','鑑定狀態'],['refine','精煉值'],['enchantGrade','附魔等級'],['attribute','物品屬性'],['equip','裝備位置值'],['bound','綁定類型'],['expireTime','到期時間（Unix）']]},
      {title:'卡片插槽',fields:[['card0','卡片 1'],['card1','卡片 2'],['card2','卡片 3'],['card3','卡片 4']]},
      {title:'隨機詞條 1–3',fields:[['optionId0','詞條 1 ID'],['optionVal0','詞條 1 數值'],['optionParm0','詞條 1 參數'],['optionId1','詞條 2 ID'],['optionVal1','詞條 2 數值'],['optionParm1','詞條 2 參數'],['optionId2','詞條 3 ID'],['optionVal2','詞條 3 數值'],['optionParm2','詞條 3 參數']]},
      {title:'隨機詞條 4–5',fields:[['optionId3','詞條 4 ID'],['optionVal3','詞條 4 數值'],['optionParm3','詞條 4 參數'],['optionId4','詞條 5 ID'],['optionVal4','詞條 5 數值'],['optionParm4','詞條 5 參數']]}
    ];
    const dangerousCommands=new Set(['@kickall','@doom','@doommap','@itemreset','@clearstorage','@cleargstorage','@clearcart','@reloadscript','@shutdown','@ban','@unban','@jail','@recallall','@raiseall','@agitstart','@agitend']);
    const categoryLabels={'System Commands':'系統','Database Commands':'資料庫','Player Information Commands':'玩家資訊','Action Commands':'角色操作','Administrative Commands':'管理','Party Commands':'隊伍','Guild Commands':'公會','Pet Commands':'寵物','Homunculus Commands':'生命體','Channel Commands':'頻道','Clan Commands':'家族'};
    const headers=()=>({'Content-Type':'application/json'});
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const normalizeKeys=value=>Array.isArray(value)?value.map(normalizeKeys):value&&typeof value==='object'?Object.fromEntries(Object.entries(value).map(([k,v])=>[k.charAt(0).toLowerCase()+k.slice(1),normalizeKeys(v)])):value;
    async function api(url,opts={}){const r=await fetch(url,opts),type=r.headers.get('content-type')||'';if(!type.includes('application/json'))throw new Error('後端版本尚未更新，請關閉 Start.cmd 視窗後重新啟動管理工具。');const data=normalizeKeys(await r.json().catch(()=>({})));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
    function toast(text,bad=false){const box=document.getElementById('toast');box.textContent=text;box.className='toast show'+(bad?' bad':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>box.className='toast',3500)}
    function closeDialog(id){document.getElementById(id).close()}
    function setActiveTab(name){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name))}
    function formatNumber(v){return Number(v||0).toLocaleString('zh-TW')}
    async function searchCharacters(){const button=document.getElementById('searchButton');button.disabled=true;try{const rows=await api('/api/characters?q='+encodeURIComponent(document.getElementById('query').value.trim()));document.getElementById('resultCount').textContent=`${rows.length} 位角色`;const box=document.getElementById('characters');box.innerHTML=rows.length?rows.map(x=>`<button class="character-row ${current?.charId===x.charId?'active':''}" onclick="selectCharacter(${x.charId})"><div class="avatar">${esc((x.name||'?').slice(0,1).toUpperCase())}</div><div><div class="char-name">${esc(x.name)}</div><div class="char-meta">Char ${x.charId} · Account ${x.accountId} · Class ${x.class}</div><div class="status ${x.online?'online':'offline'}">${x.online?'在線':'離線'}${x.lastMap?' · '+esc(x.lastMap):''}</div></div><div class="levels"><strong>Lv. ${x.baseLevel}</strong>Job ${x.jobLevel}</div></button>`).join(''):'<div class="empty">找不到符合條件的角色</div>'}catch(e){toast(e.message,true)}finally{button.disabled=false}}
    async function selectCharacter(id){try{current=await api('/api/characters/'+id);document.getElementById('welcome').hidden=true;document.getElementById('detail').hidden=false;document.getElementById('charTitle').textContent=current.name;document.getElementById('charMeta').innerHTML=`<span class="chip">Char ID ${current.charId}</span><span class="chip">Account ${current.accountId}</span><span class="chip">Class ${current.class}</span><span class="chip">Base ${current.baseLevel} / Job ${current.jobLevel}</span><span class="chip">${esc(current.lastMap||'未知地圖')}</span><span class="status ${current.online?'online':'offline'}">${current.online?'在線':'離線'}</span>`;document.getElementById('charZeny').textContent=formatNumber(current.zeny);const warning=document.getElementById('warning');warning.hidden=!current.online;warning.textContent='角色目前在線。資料可能由 map-server 記憶體覆寫；請確認伺服器端即時同步功能已啟用後再修改。';await searchCharacters();showTab('stats')}catch(e){toast(e.message,true)}}
    async function showTab(name){if(!current)return;setActiveTab(name);const box=document.getElementById('content');box.innerHTML='<div class="empty">載入中…</div>';try{if(name==='stats')renderStats();else if(name==='jobs')await renderJobs();else if(name==='inventory'){currentContainer='inventory';renderItems(await api(`/api/characters/${current.charId}/inventory`),'背包與裝備')}else if(name==='storage'){currentContainer='storage';renderItems(await api(`/api/accounts/${current.accountId}/storage`),'帳號倉庫')}else if(name==='commands')await renderCommands();else renderAdvanced()}catch(e){box.innerHTML=`<div class="empty error">${esc(e.message)}</div>`}}
    function renderStats(){document.getElementById('content').innerHTML=`<h3 class="section-title">能力與資源</h3><p class="section-note">數值依用途分區，修改後按最下方儲存。</p>${statGroups.map(g=>`<section class="stat-section"><div class="stat-section-head"><h3>${g.title}</h3><span>${g.note}</span></div><div class="form-grid">${g.fields.map(([key,label])=>`<div class="field"><label for="s_${key}">${label}</label><input id="s_${key}" type="number" value="${current[key]??0}"></div>`).join('')}</div></section>`).join('')}<div class="actions"><span id="statsMessage" class="message"></span><button class="btn" onclick="saveStats()">儲存所有能力</button></div>`}
    async function saveStats(){const message=document.getElementById('statsMessage');try{const body={};statGroups.flatMap(g=>g.fields).forEach(([key])=>body[key]=Number(document.getElementById('s_'+key).value));await api(`/api/characters/${current.charId}/stats`,{method:'PUT',headers:headers(),body:JSON.stringify(body)});message.className='message ok';message.textContent='已儲存';current=await api('/api/characters/'+current.charId);document.getElementById('charZeny').textContent=formatNumber(current.zeny);toast('角色能力已儲存')}catch(e){message.className='message error';message.textContent=e.message}}
    async function renderJobs(){if(!jobCatalog.length)jobCatalog=await api('/api/jobs');if(!Array.isArray(jobCatalog))throw new Error('職業清單格式不正確，請重新啟動管理工具。');selectedJob=jobCatalog.find(x=>x.id===current.class)||null;const categories=['全部',...new Set(jobCatalog.map(x=>x.category))];document.getElementById('content').innerHTML=`<h3 class="section-title">職業管理</h3><p class="section-note">目前職業 ID：${current.class}。可搜尋本版本 rAthena 支援的所有職業常數與說明。</p><div class="job-picker"><div class="job-filters"><input id="jobSearch" placeholder="搜尋中文、英文或職業 ID" oninput="drawJobList()"><select id="jobCategory" onchange="drawJobList()">${categories.map(x=>`<option>${esc(x)}</option>`).join('')}</select><div id="jobList" class="job-list"></div></div><div id="jobDetail" class="job-detail"></div></div>`;drawJobList();drawJobDetail()}
    function jobDisplayName(job){const known={JOB_NOVICE:'初心者',JOB_SWORDMAN:'劍士',JOB_MAGE:'魔法師',JOB_ARCHER:'弓箭手',JOB_ACOLYTE:'服事',JOB_MERCHANT:'商人',JOB_THIEF:'盜賊',JOB_KNIGHT:'騎士',JOB_PRIEST:'祭司',JOB_WIZARD:'巫師',JOB_BLACKSMITH:'鐵匠',JOB_HUNTER:'獵人',JOB_ASSASSIN:'刺客',JOB_CRUSADER:'十字軍',JOB_MONK:'武僧',JOB_SAGE:'賢者',JOB_ROGUE:'流氓',JOB_ALCHEMIST:'鍊金術師',JOB_BARD:'詩人',JOB_DANCER:'舞孃',JOB_SUPER_NOVICE:'超級初心者',JOB_SUPER_BABY:'養子超級初心者',JOB_SUPER_NOVICE_E:'進階超級初心者',JOB_SUPER_BABY_E:'進階養子超級初心者',JOB_GUNSLINGER:'神槍手',JOB_NINJA:'忍者',JOB_LORD_KNIGHT:'騎士領主',JOB_HIGH_PRIEST:'神官',JOB_HIGH_WIZARD:'超魔導師',JOB_WHITESMITH:'神工匠',JOB_SNIPER:'神射手',JOB_ASSASSIN_CROSS:'十字刺客',JOB_PALADIN:'聖殿十字軍',JOB_CHAMPION:'武術宗師',JOB_PROFESSOR:'智者',JOB_STALKER:'神行太保',JOB_CREATOR:'創造者',JOB_CLOWN:'搞笑藝人',JOB_GYPSY:'冷豔舞姬',JOB_TAEKWON:'跆拳少年／少女',JOB_STAR_GLADIATOR:'拳聖',JOB_SOUL_LINKER:'悟靈士',JOB_RUNE_KNIGHT:'盧恩騎士',JOB_WARLOCK:'咒術士',JOB_RANGER:'遊俠',JOB_ARCH_BISHOP:'大主教',JOB_MECHANIC:'機械工匠',JOB_GUILLOTINE_CROSS:'十字斬首者',JOB_ROYAL_GUARD:'皇家禁衛隊',JOB_SORCERER:'妖術師',JOB_MINSTREL:'宮廷樂師',JOB_WANDERER:'浪姬舞者',JOB_SURA:'修羅',JOB_GENETIC:'基因學者',JOB_SHADOW_CHASER:'魅影追蹤者',JOB_KAGEROU:'影狼',JOB_OBORO:'朧',JOB_REBELLION:'叛亂者',JOB_SUMMONER:'召喚師',JOB_STAR_EMPEROR:'星帝',JOB_SOUL_REAPER:'獵靈士',JOB_DRAGON_KNIGHT:'天龍騎士',JOB_MEISTER:'機甲神匠',JOB_SHADOW_CROSS:'十字影武',JOB_ARCH_MAGE:'禁咒魔導士',JOB_CARDINAL:'樞機主教',JOB_WINDHAWK:'風鷹狩獵者',JOB_IMPERIAL_GUARD:'帝國聖衛軍',JOB_BIOLO:'生命締造者',JOB_ABYSS_CHASER:'深淵追跡者',JOB_ELEMENTAL_MASTER:'元素支配者',JOB_INQUISITOR:'聖裁者',JOB_TROUBADOUR:'天籟頌者',JOB_TROUVERE:'樂之舞靈',JOB_SKY_EMPEROR:'天帝',JOB_SOUL_ASCETIC:'靈導士',JOB_SHINKIRO:'蜃氣樓',JOB_SHIRANUI:'不知火',JOB_NIGHT_WATCH:'夜巡者',JOB_HYPER_NOVICE:'終極初心者',JOB_SPIRIT_HANDLER:'魂靈師'};if(known[job.name])return known[job.name];const base=job.name.replace(/_T2?$|2$|_2ND$/,'');if(known[base])return known[base]+'（變體）';if(job.name.startsWith('JOB_BABY_')){const parent={...job,name:job.name.replace('JOB_BABY_','JOB_')};return '養子 '+jobDisplayName(parent)}return job.name.replace('JOB_','').replaceAll('_',' ')}
    function drawJobList(){const q=(document.getElementById('jobSearch')?.value||'').trim().toLowerCase(),category=document.getElementById('jobCategory')?.value||'全部';const rows=jobCatalog.filter(x=>(category==='全部'||x.category===category)&&(!q||String(x.id).includes(q)||x.name.toLowerCase().includes(q)||jobDisplayName(x).toLowerCase().includes(q)));document.getElementById('jobList').innerHTML=rows.map(x=>`<button class="job-card ${selectedJob?.id===x.id?'selected':''}" onclick="selectJob(${x.id})"><span class="job-id">${x.id}</span><span><b>${esc(jobDisplayName(x))}</b><small>${esc(x.name)} · ${esc(x.category)}</small></span>${x.id===current.class?'<span class="job-current">目前</span>':''}</button>`).join('')||'<div class="empty">找不到符合的職業</div>'}
    function selectJob(id){selectedJob=jobCatalog.find(x=>x.id===id);drawJobList();drawJobDetail()}
    function drawJobDetail(){const box=document.getElementById('jobDetail');if(!selectedJob){box.innerHTML='<div class="empty">從左側選擇職業查看說明</div>';return}const isCurrent=selectedJob.id===current.class;box.innerHTML=`<span class="chip">${esc(selectedJob.category)}</span><h3>${esc(jobDisplayName(selectedJob))}</h3><div class="job-constant">ID ${selectedJob.id} · ${esc(selectedJob.name)}</div><p class="job-description">${esc(selectedJob.description)}</p><div class="job-caution">此功能會在角色在線時，由 map-server 執行原生 jobchange 流程（等同 GM 的 @jobchange）。職業外觀與狀態會立即更新；不會自動贈送技能或重置既有技能。</div><div class="actions"><span id="jobMessage" class="message"></span><button class="btn ${isCurrent?'secondary':''}" onclick="changeJob()" ${isCurrent||!selectedJob.selectable?'disabled':''}>${isCurrent?'目前使用中':selectedJob.selectable?'執行 @jobchange':'此變體不可直接轉職'}</button></div>`}
    async function changeJob(){if(!selectedJob||selectedJob.id===current.class)return;if(!confirm(`角色必須保持在線。確定透過 map-server 將「${current.name}」轉職為 ${jobDisplayName(selectedJob)}（ID ${selectedJob.id}）？`))return;const message=document.getElementById('jobMessage'),jobId=selectedJob.id;try{message.className='message muted';message.textContent='等待 map-server 執行轉職…';await api(`/api/characters/${current.charId}/job`,{method:'PUT',headers:headers(),body:JSON.stringify({jobId})});for(let i=0;i<16;i++){await new Promise(r=>setTimeout(r,250));const status=await api(`/api/characters/${current.charId}/job/status`);if(status?.jobId===jobId&&status.processedAt){current=await api('/api/characters/'+current.charId);toast('map-server 已完成原生轉職');await selectCharacter(current.charId);showTab('jobs');return}}message.className='message error';message.textContent='map-server 尚未回報；請確認 NPC 腳本已重新載入'}catch(e){message.className='message error';message.textContent=e.message}}
    function renderItems(items,title){itemCache=items;document.getElementById('content').innerHTML=`<div class="toolbar"><h3>${title} <span class="count">${items.length} 件</span></h3><input id="itemSearch" placeholder="搜尋 NameID、資料列 ID" oninput="filterItems()"><button class="btn" onclick="openNewItem()">新增物品</button></div><div id="itemTable"></div>`;drawItemTable(items)}
    function filterItems(){const q=document.getElementById('itemSearch').value.trim();drawItemTable(itemCache.filter(x=>!q||String(x.nameId).includes(q)||String(x.id).includes(q)))}
    function drawItemTable(items){const box=document.getElementById('itemTable');box.innerHTML=items.length?`<div class="table-wrap"><table><thead><tr><th>物品</th><th>數量</th><th>精煉</th><th>裝備位置</th><th>附魔</th><th>卡片</th><th>操作</th></tr></thead><tbody>${items.map(x=>{const url=`https://rd.fharr.com/db/item/${x.nameId}`,img=`https://rd.fharr.com/images/tw/item/thumbnail/${x.nameId}/`;return `<tr><td><div class="item-cell"><img class="item-icon" src="${img}" alt="" loading="lazy"><div><a class="item-name" href="${url}" target="_blank" rel="noopener">NameID ${x.nameId}</a><div class="muted">資料列 #${x.id}</div></div></div></td><td>${formatNumber(x.amount)}</td><td>+${x.refine}</td><td>${x.equip}</td><td>${['無','D','C','B','A'][x.enchantGrade]||x.enchantGrade}</td><td>${x.card0}, ${x.card1}, ${x.card2}, ${x.card3}</td><td><div class="row-actions"><button class="btn secondary small" onclick="editItemById(${x.id})">編輯</button><button class="btn danger small" onclick="deleteItem(${x.id},${x.nameId})">刪除</button></div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">此區目前沒有物品</div>'}
    function editItemById(id){editItem(itemCache.find(x=>x.id===id))}
    function editItem(item){editingItem=item;document.getElementById('itemDialogTitle').textContent=item.id==null?'新增物品':`編輯物品 · NameID ${item.nameId}`;document.getElementById('itemForm').innerHTML=itemGroups.map(g=>`<section class="stat-section"><div class="stat-section-head"><h3>${g.title}</h3></div><div class="form-grid">${g.fields.map(([key,label])=>`<div class="field"><label for="i_${key}">${label}</label>${itemSelectOrInput(key,item[key]??0)}</div>`).join('')}</div></section>`).join('');document.getElementById('itemMessage').textContent='';document.getElementById('itemDialog').showModal()}
    function itemSelectOrInput(key,value){const sets={identify:[[1,'已鑑定'],[0,'未鑑定']],bound:[[0,'未綁定'],[1,'帳號綁定'],[2,'角色綁定'],[3,'公會綁定'],[4,'隊伍綁定']],enchantGrade:[[0,'無'],[1,'D'],[2,'C'],[3,'B'],[4,'A']]};return sets[key]?`<select id="i_${key}">${sets[key].map(([v,t])=>`<option value="${v}" ${Number(value)===v?'selected':''}>${t}</option>`).join('')}</select>`:`<input id="i_${key}" type="number" value="${value}">`}
    function openNewItem(){const item={id:null};itemGroups.flatMap(g=>g.fields).forEach(([key])=>item[key]=0);Object.assign(item,{nameId:501,amount:1,identify:1});editItem(item)}
    async function saveItem(){const message=document.getElementById('itemMessage');try{const body={};itemGroups.flatMap(g=>g.fields).forEach(([key])=>body[key]=Number(document.getElementById('i_'+key).value));const creating=editingItem.id==null,url=creating?(currentContainer==='inventory'?`/api/characters/${current.charId}/inventory`:`/api/accounts/${current.accountId}/storage`):`/api/items/${currentContainer}/${editingItem.id}`;await api(url,{method:creating?'POST':'PUT',headers:headers(),body:JSON.stringify(body)});closeDialog('itemDialog');toast(creating?'物品已新增':'物品已更新');showTab(currentContainer)}catch(e){message.className='message error';message.textContent=e.message}}
    async function deleteItem(id,nameId){if(!confirm(`確定刪除 NameID ${nameId}？此操作無法復原。`))return;try{await api(`/api/items/${currentContainer}/${id}`,{method:'DELETE',headers:headers()});toast('物品已刪除');showTab(currentContainer)}catch(e){toast(e.message,true)}}
    async function renderCommands(){if(!commandCatalog.length)commandCatalog=await api('/api/atcommands');document.getElementById('content').innerHTML=`<div class="toolbar"><h3>GM 指令中心</h3><input id="commandSearch" placeholder="搜尋指令或用途" oninput="drawCommands()"></div><p class="section-note">指令會以目前角色作為執行者送至 map-server。</p><div id="commandList"></div>`;drawCommands()}
    function drawCommands(){const q=(document.getElementById('commandSearch')?.value||'').toLowerCase(),groups={};commandCatalog.filter(x=>(x.name+' '+x.usage+' '+(x.descriptionZh||x.description||'')).toLowerCase().includes(q)).forEach(x=>(groups[x.category]??=[]).push(x));document.getElementById('commandList').innerHTML=Object.entries(groups).map(([category,items])=>`<h3 class="category">${categoryLabels[category]||category} <span class="count">${items.length}</span></h3><div class="commands">${items.map(x=>`<button class="command" onclick="openAtCommand('${esc(x.name)}')"><b>${esc(x.name)}</b><span>${esc(x.descriptionZh||x.description||'GM 指令')}</span><span>${esc(x.usage||'不需參數')}</span></button>`).join('')}</div>`).join('')||'<div class="empty">找不到指令</div>'}
    function openAtCommand(name){selectedCommand=commandCatalog.find(x=>x.name===name);document.getElementById('commandName').textContent=selectedCommand.name;document.getElementById('commandDescription').textContent=selectedCommand.descriptionZh||selectedCommand.description||'GM 管理指令';document.getElementById('commandDanger').hidden=!dangerousCommands.has(name);document.getElementById('commandArgs').value='';document.getElementById('commandArgs').placeholder=selectedCommand.usage||'此指令不需參數';document.getElementById('commandUsage').textContent=selectedCommand.usage?`用法：${name} ${selectedCommand.usage}`:'不需額外參數';document.getElementById('commandMessage').textContent='';document.getElementById('commandDialog').showModal()}
    async function sendAtCommand(){const args=document.getElementById('commandArgs').value.trim(),command=selectedCommand.name+(args?' '+args:''),message=document.getElementById('commandMessage');try{message.className='message muted';message.textContent='等待 map-server 處理…';await api('/api/atcommands/execute',{method:'POST',headers:headers(),body:JSON.stringify({executorCharId:current.charId,command})});for(let i=0;i<12;i++){await new Promise(r=>setTimeout(r,250));const status=await api(`/api/atcommands/status/${current.charId}`);if(status?.command===command&&status.processedAt){message.className='message ok';message.textContent='指令已執行';toast('GM 指令已執行');return}}message.className='message error';message.textContent='map-server 尚未回報處理結果'}catch(e){message.className='message error';message.textContent=e.message}}
    function renderAdvanced(){document.getElementById('content').innerHTML=`<h3 class="section-title">進階操作</h3><p class="section-note">集中放置低頻率且高風險的管理功能。</p><section class="danger-zone"><h3>複製玩家資料至 GM</h3><p class="muted">將目前角色的能力、物品及倉庫資料複製到指定 GM 角色。目標角色原有資料可能被覆蓋。</p><div class="form-grid"><div class="field"><label>目標 GM Char ID</label><input id="cloneTargetId" type="number" min="1" placeholder="例如：50000"></div></div><div class="actions"><span id="cloneMessage" class="message"></span><button class="btn danger" onclick="cloneToGm()">確認複製</button></div></section>`}
    async function cloneToGm(){const id=Number(document.getElementById('cloneTargetId').value),message=document.getElementById('cloneMessage');if(!id){message.className='message error';message.textContent='請輸入目標 Char ID';return}if(!confirm(`確定將「${current.name}」的資料複製到 Char ID ${id}？`))return;try{await api(`/api/characters/${current.charId}/clone-to-gm`,{method:'POST',headers:headers(),body:JSON.stringify({targetCharId:id})});message.className='message ok';message.textContent='複製完成';toast('角色資料已複製')}catch(e){message.className='message error';message.textContent=e.message}}
    document.getElementById('query').addEventListener('keydown',e=>{if(e.key==='Enter')searchCharacters()});
    searchCharacters();
  </script>
</body>
